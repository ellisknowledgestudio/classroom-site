name: Deploy to Hostinger

# Runs when a change lands on main (i.e. when James merges a pull request),
# or manually from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Uploads only files that changed since the last deploy. It never deletes
      # files it didn't upload itself, so server-only files (api/lead.php,
      # coach-config.php, the notes folder etc.) are left alone.
      # The FTP account is limited to this site's public_html, so './' = public_html.
      - name: Upload changed files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
