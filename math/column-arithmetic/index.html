<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Column Working-Out Pad · Ellis Knowledge Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF7EC;
    --rule:#C7DCEC;
    --margin:#C0453B;
    --ink:#223046;
    --pencil:#3B4550;
    --mustard:#C98A2B;
    --mustard-bg:#F4E3C4;
    --good:#3C8D66;
    --good-bg:#DDEFE4;
    --bad:#C0453B;
    --bad-bg:#F7E1DE;
    --cellsize:2.6em;
    --cellsize-sm:1.9em;
    --display-font:'Patrick Hand',cursive;
    --display-weight:400;
  }
  /* Patrick Hand is a Latin-only handwriting font with no proper glyphs for
     Greek, Chinese, or Japanese, so headings in those languages fall back
     to a font that actually supports the script instead of rendering
     broken/malformed characters. */
  html[lang="el"], html[lang="zh"], html[lang="ja"]{
    --display-font:'Work Sans',sans-serif;
    --display-weight:700;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Work Sans',sans-serif;
    color:var(--ink);
    background:#E7EEF4;
    padding:24px 12px 60px;
  }
  .book{
    max-width:920px;
    margin:0 auto;
    background:var(--paper);
    border-radius:10px;
    box-shadow:0 10px 30px rgba(34,48,70,.18);
    position:relative;
    padding:34px 26px 26px 66px;
    overflow:hidden;
  }
  .book::before{
    content:'';
    position:absolute; left:48px; top:0; bottom:0; width:2px;
    background:var(--margin); opacity:.55;
  }
  .binder-holes{
    position:absolute; left:14px; top:0; bottom:0; width:16px;
    background-image:radial-gradient(circle, #cfd8e0 0 5px, transparent 5.5px);
    background-size:16px 46px;
    background-position:0 20px;
    background-repeat:repeat-y;
    opacity:.8;
  }
  .site-nav{font-size:.85em; color:#5A6472; margin-bottom:10px;}
  .site-nav a{color:#5A6472; text-decoration:underline; text-underline-offset:2px;}
  .site-nav a:hover{color:var(--mustard);}
  header.top{margin-bottom:14px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
  h1{
    font-family:var(--display-font);
    font-weight:var(--display-weight);
    font-size:2.3em;
    margin:0 0 2px 0;
    color:var(--ink);
    line-height:1;
  }
  .subtitle{margin:0; color:#5A6472; font-size:.95em; max-width:56ch;}
  .best-badge{
    font-size:.8em; color:var(--mustard); font-weight:700;
    background:var(--mustard-bg); border:1px solid var(--mustard);
    border-radius:20px; padding:4px 12px; white-space:nowrap; margin-top:4px;
  }
  .header-side{display:flex; flex-direction:column; align-items:flex-end; gap:8px;}
  .lang-field{display:flex; align-items:center; gap:6px; font-size:.85em;}
  .lang-field label{font-weight:600; color:#5A6472;}
  .lang-field select{padding:4px 8px; font-size:.95em;}

  .tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .tab-btn{
    font-family:var(--display-font);
    font-weight:var(--display-weight);
    font-size:1.15em;
    background:#fff;
    border:2px solid var(--ink);
    border-bottom-width:4px;
    border-radius:8px 8px 4px 4px;
    padding:6px 16px;
    cursor:pointer;
    color:var(--ink);
    transition:transform .12s ease, background .15s ease;
  }
  .tab-btn:hover{transform:translateY(-1px);}
  .tab-btn.active{background:var(--mustard-bg); border-color:var(--mustard);}
  .locked{opacity:.45; pointer-events:none;}

  details.howto{
    background:#fff;
    border:1px solid var(--rule);
    border-radius:8px;
    padding:10px 14px;
    margin-bottom:14px;
  }
  details.howto summary{
    cursor:pointer; font-weight:600; font-family:var(--display-font); font-size:1.25em;
  }
  details.howto ol{margin:10px 0 4px 0; padding-left:22px;}
  details.howto li{margin-bottom:5px; line-height:1.4;}

  .custom-sum-panel{
    background:#fff; border:1px solid var(--rule); border-radius:8px;
    padding:10px 14px; margin-bottom:16px;
  }
  .custom-sum-panel summary{cursor:pointer; font-weight:600; font-family:var(--display-font); font-size:1.15em;}
  .custom-sum-body{margin-top:12px; display:flex; flex-direction:column; gap:8px;}
  .custom-sum-body label{font-weight:600; color:#5A6472; font-size:.85em;}
  .custom-sum-fields{display:flex; gap:14px; flex-wrap:wrap;}
  .custom-num-list{display:flex; gap:8px; flex-wrap:wrap;}
  .custom-num-input{
    font-family:'Space Mono',monospace; font-size:1em;
    border:1px solid #B9C2CC; border-radius:6px; padding:7px 10px; width:8em;
  }
  .custom-num-input:focus{outline:2px solid var(--mustard); outline-offset:1px; border-color:var(--mustard);}
  .custom-sum-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .custom-sum-error{color:var(--bad); font-size:.85em; font-weight:600; min-height:1.2em;}

  .settings-panel{
    background:#fff;
    border:1px solid var(--rule);
    border-radius:8px;
    padding:14px;
    margin-bottom:16px;
    display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end;
  }
  .settings-group{display:none; flex-wrap:wrap; gap:14px; align-items:flex-end;}
  .settings-group.active{display:flex;}
  .field{display:flex; flex-direction:column; gap:3px; font-size:.85em;}
  .field label{font-weight:600; color:#5A6472;}
  select, .btn{
    font-family:'Work Sans',sans-serif;
    font-size:.95em;
    padding:6px 10px;
    border-radius:6px;
    border:1px solid #B9C2CC;
    background:#fff;
    color:var(--ink);
  }
  .btn{
    cursor:pointer;
    border:2px solid var(--ink);
    background:var(--ink);
    color:#fff;
    font-weight:600;
    padding:9px 16px;
    transition:transform .1s ease, box-shadow .15s ease;
  }
  .btn:hover:not(:disabled){transform:translateY(-1px); box-shadow:0 3px 0 rgba(34,48,70,.25);}
  .btn:active:not(:disabled){transform:translateY(0); box-shadow:none;}
  .btn.secondary{background:#fff; color:var(--ink);}
  .btn.subtle{background:transparent; color:#5A6472; border-color:#B9C2CC; font-weight:500;}
  .btn:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none;}
  .eraser-icon{
    width:20px; height:13px; display:inline-block; margin-right:6px;
    background:linear-gradient(90deg,#EFA9A2 50%,#ECECEC 50%);
    border:1px solid var(--ink); border-radius:3px; transform:rotate(-8deg) translateY(1px);
  }
  select:focus-visible, .btn:focus-visible, .tab-btn:focus-visible, input:focus-visible{
    outline:3px solid var(--mustard); outline-offset:2px;
  }

  .problem-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:6px 0 10px 0;}
  #problemTitle{
    font-family:var(--display-font);
    font-weight:var(--display-weight);
    font-size:1.6em;
    margin:0;
  }
  .streak-badge{
    font-size:.85em; font-weight:700; color:var(--mustard);
    background:var(--mustard-bg); padding:3px 10px; border-radius:20px;
    display:none;
  }
  .streak-badge.show{display:inline-block; animation:pop .25s ease;}

  .grid-scroll{overflow-x:auto; padding-bottom:4px; margin-bottom:4px;}
  #problemArea{margin-bottom:12px;}
  .step-label{font-weight:600; color:#5A6472; margin:14px 0 6px 0; font-size:.9em;}
  .block{display:inline-flex; flex-direction:column; align-items:flex-end; margin-bottom:6px; animation:fadeInUp .35s ease;}
  .grid-row{display:grid; column-gap:2px; align-items:center;}
  .cell{
    height:var(--cellsize); min-width:var(--cellsize);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono',monospace; font-size:1.25em;
  }
  .cell.fixed{color:var(--ink); font-weight:700;}
  .cell.op-cell{font-weight:700; color:var(--ink); justify-content:flex-start; font-size:1.25em;}
  .cell.blank{}
  .input-cell{
    border:none; border-bottom:3px solid var(--ink);
    background:transparent; text-align:center; color:var(--pencil);
    font-family:'Space Mono',monospace; font-size:1.05em; font-weight:700;
    padding:0; position:relative;
  }
  .input-cell:focus{outline:none; border-bottom-color:var(--mustard); background:rgba(201,138,43,.08);}
  .input-cell:disabled{cursor:not-allowed; opacity:.65;}
  .carry-row .cell{height:var(--cellsize-sm); min-width:var(--cellsize-sm);}
  .carry-row .input-cell{
    border-bottom:2px solid var(--mustard); color:var(--mustard); font-size:.85em;
  }
  .answer-row{border-top:3px solid var(--ink); margin-top:2px; padding-top:4px;}
  .placeholder-cell{color:#9AA4AF;}
  .needs-answer{animation:needsAnswer .9s ease; border-bottom-color:var(--bad) !important;}
  .correct{background:var(--good-bg); border-bottom-color:var(--good) !important; color:var(--good) !important; animation:pop .2s ease;}
  .incorrect{background:var(--bad-bg); border-bottom-color:var(--bad) !important; color:var(--bad) !important; animation:shake .3s ease;}
  .carry-row .input-cell.correct::after{
    content:'\21B0'; position:absolute; top:-14px; left:50%;
    color:var(--mustard); font-size:1.1em; opacity:0;
    animation:carryHop .6s ease forwards;
  }

  .division-block{align-items:flex-start;}
  .division-quotient{}
  .division-main{align-items:end;}
  .divisor-cell{
    font-family:'Space Mono',monospace; font-weight:700; font-size:1.25em;
    padding-right:8px; border-right:3px solid var(--ink);
    display:flex; align-items:center; justify-content:flex-end;
    height:var(--cellsize);
  }
  .bracket-top{border-top:3px solid var(--ink);}
  .remainder-line{margin:10px 0 4px 2px; font-size:.95em; color:#5A6472;}
  .remainder-line .input-cell{display:inline-flex; width:1.6em; margin-left:4px;}

  .scratch-section{margin-top:18px;}
  .scratch-section label{display:block; font-weight:600; color:#5A6472; font-size:.85em; margin-bottom:6px;}
  textarea#scratchpad{
    width:100%; min-height:130px; resize:vertical;
    font-family:'Space Mono',monospace; font-size:1em; color:var(--pencil);
    border:1px solid var(--rule); border-radius:6px; padding:10px;
    background:
      repeating-linear-gradient(#fff 0px, #fff 27px, var(--rule) 28px, #fff 29px),
      repeating-linear-gradient(90deg, #fff 0px, #fff 27px, var(--rule) 28px, #fff 29px);
  }

  .controls-bar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin-top:16px; padding-top:14px; border-top:1px dashed #B9C2CC;
  }
  .feedback{font-weight:600;}
  .feedback.ok{color:var(--good);}
  .feedback.bad{color:var(--bad);}
  .progress-info{margin-left:auto; font-size:.9em; color:#5A6472; font-weight:600;}

  .hidden{display:none !important;}
  #summaryPanel{background:#fff; border:1px solid var(--rule); border-radius:8px; padding:18px; position:relative; overflow:hidden;}
  #summaryPanel h2{font-family:var(--display-font); font-weight:var(--display-weight); margin-top:0;}
  #summaryScore{font-size:1.8em; font-weight:700; color:var(--mustard);}
  #summaryList{list-style:none; padding:0; margin:14px 0;}
  #summaryList li{padding:6px 8px; border-radius:6px; margin-bottom:4px;}
  #summaryList li.ok{background:var(--good-bg); color:var(--good);}
  #summaryList li.bad{background:var(--bad-bg); color:var(--bad);}
  .confetti-piece{
    position:absolute; top:-10px; width:8px; height:14px; opacity:.9;
    animation:confettiFall 1.6s ease-in forwards;
  }

  @keyframes fadeInUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  @keyframes pop{0%{transform:scale(1);} 40%{transform:scale(1.18);} 100%{transform:scale(1);}}
  @keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-3px);} 75%{transform:translateX(3px);}}
  @keyframes carryHop{0%{opacity:0; transform:translate(-50%,4px) scale(.7);} 40%{opacity:1; transform:translate(-50%,-6px) scale(1);} 100%{opacity:0; transform:translate(-50%,-14px) scale(.9);}}
  @keyframes confettiFall{to{transform:translateY(340px) rotate(280deg); opacity:0;}}
  @keyframes needsAnswer{0%,100%{background:transparent;} 30%,70%{background:var(--bad-bg);}}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block; position:absolute; top:0; left:0; width:100%;}
    .print-problem{break-inside:avoid; margin-bottom:22px; display:flex; gap:10px;}
    .print-answer-key{page-break-before:always;}
  }

  @media (max-width:600px){
    :root{--cellsize:2.15em; --cellsize-sm:1.6em;}
    .book{padding:26px 14px 22px 40px;}
    .book::before{left:26px;}
    .binder-holes{left:6px; width:12px; background-size:12px 40px;}
    h1{font-size:1.7em;}
    .subtitle{font-size:.88em;}
  }
</style>

<body>
<div class="book">
  <div class="binder-holes"></div>
  <nav class="site-nav">
    <a href="/">Classroom</a><span aria-hidden="true"> &rsaquo; </span><a href="/math/">Math Resources</a>
  </nav>
  <header class="top">
    <div>
      <h1 data-i18n="appTitle">Column Working-Out Pad</h1>
      <p class="subtitle" data-i18n="appSubtitle">Practice long addition, subtraction, multiplication and division — show your carries, borrows and workings, then get it marked.</p>
    </div>
    <div class="header-side">
      <div class="lang-field">
        <label for="langSelect" data-i18n="labelLanguage">Language</label>
        <select id="langSelect">
          <option value="en">English</option>
          <option value="el">Ελληνικά</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="it">Italiano</option>
          <option value="zh">中文</option>
          <option value="ja">日本語</option>
        </select>
      </div>
      <div class="best-badge hidden" id="bestBadge"></div>
    </div>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab-btn" data-op="add" data-i18n="tabAdd">Addition</button>
    <button class="tab-btn" data-op="sub" data-i18n="tabSub">Subtraction</button>
    <button class="tab-btn" data-op="mul" data-i18n="tabMul">Multiplication</button>
    <button class="tab-btn" data-op="div" data-i18n="tabDiv">Division</button>
  </div>

  <details class="howto" id="howto" open>
    <summary data-i18n="howtoSummary">How to do this</summary>
    <ol id="howtoList"></ol>
  </details>

  <div class="settings-panel" id="settingsPanel">
    <div class="settings-group" data-op="add">
      <div class="field"><label data-i18n="labelDigitsPerNumber">Digits per number</label>
        <select id="add-digits">
          <option value="2">2</option><option value="3" selected>3</option>
          <option value="4">4</option><option value="5">5</option><option value="6">6</option>
        </select>
      </div>
      <div class="field"><label data-i18n="labelNumbersToAdd">Numbers to add</label>
        <select id="add-addends">
          <option value="2" selected>2</option><option value="3">3</option>
          <option value="4">4</option><option value="5">5</option><option value="6">6</option>
        </select>
      </div>
    </div>
    <div class="settings-group" data-op="sub">
      <div class="field"><label data-i18n="labelDigitsTop">Digits in top number</label>
        <select id="sub-top-digits">
          <option value="2">2</option><option value="3" selected>3</option>
          <option value="4">4</option><option value="5">5</option><option value="6">6</option>
        </select>
      </div>
      <div class="field"><label data-i18n="labelDigitsBottom">Digits in bottom number</label>
        <select id="sub-bottom-digits">
          <option value="2">2</option><option value="3" selected>3</option>
          <option value="4">4</option><option value="5">5</option><option value="6">6</option>
        </select>
      </div>
    </div>
    <div class="settings-group" data-op="mul">
      <div class="field"><label data-i18n="labelDigitsFirstNumber">Digits in first number</label>
        <select id="mul-mc">
          <option value="2" selected>2</option><option value="3">3</option><option value="4">4</option>
        </select>
      </div>
      <div class="field"><label data-i18n="labelDigitsMultiplier">Digits in multiplier</label>
        <select id="mul-mr">
          <option value="1" selected>1</option><option value="2">2</option><option value="3">3</option>
          <option value="4">4</option>
        </select>
      </div>
      <div class="field"><label data-i18n="labelMulMethod">Working method</label>
        <select id="mul-method">
          <option value="steps" selected data-i18n="optMulSteps">Show step-by-step</option>
          <option value="whole" data-i18n="optMulWhole">Whole sum (work it out yourself)</option>
        </select>
      </div>
    </div>
    <div class="settings-group" data-op="div">
      <div class="field"><label data-i18n="labelDigitsDividend">Digits in dividend</label>
        <select id="div-dd">
          <option value="2">2</option><option value="3" selected>3</option>
          <option value="4">4</option><option value="5">5</option><option value="6">6</option>
        </select>
      </div>
      <div class="field"><label data-i18n="labelDigitsDivisor">Digits in divisor</label>
        <select id="div-dr">
          <option value="1" selected>1</option><option value="2">2</option><option value="3">3</option>
          <option value="4">4</option><option value="5">5</option><option value="6">6</option>
        </select>
      </div>
      <div class="field"><label data-i18n="labelType">Type</label>
        <select id="div-exact"><option value="exact" selected data-i18n="optExact">Divides exactly</option><option value="rem" data-i18n="optRem">May leave a remainder</option></select>
      </div>
      <div class="field"><label data-i18n="labelMulMethod">Working method</label>
        <select id="div-method">
          <option value="whole" selected data-i18n="optMulWhole">Whole sum (work it out yourself)</option>
          <option value="steps" data-i18n="optMulSteps">Show step-by-step</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button class="btn secondary" id="newBtn" data-i18n="btnNewProblem">New problem</button>
    </div>
    <div class="field">
      <label data-i18n="labelTestLength">Test length</label>
      <select id="testCount"><option value="5" data-i18n="opt5Questions">5 questions</option><option value="10" selected data-i18n="opt10Questions">10 questions</option><option value="15" data-i18n="opt15Questions">15 questions</option></select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button class="btn" id="startTestBtn" data-i18n="btnStartTest">Start test</button>
    </div>
    <div class="field">
      <label data-i18n="labelWorksheetSize">Worksheet size</label>
      <select id="printCount"><option value="6" data-i18n="opt6Problems">6 problems</option><option value="10" selected data-i18n="opt10Problems">10 problems</option><option value="16" data-i18n="opt16Problems">16 problems</option></select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button class="btn subtle" id="printBtn" data-i18n="btnPrintWorksheet">Print worksheet</button>
    </div>
  </div>

  <details class="custom-sum-panel" id="customSumPanel">
    <summary data-i18n="customSumSummary">Type in your own sum instead</summary>
    <div class="custom-sum-body" data-op="add" id="customBody-add">
      <label data-i18n="labelNumbersToAdd">Numbers to add</label>
      <div class="custom-num-list" id="customAddList">
        <input type="text" inputmode="numeric" class="custom-num-input" data-i18n-placeholder="customNumPlaceholder" placeholder="Enter a number">
        <input type="text" inputmode="numeric" class="custom-num-input" data-i18n-placeholder="customNumPlaceholder" placeholder="Enter a number">
      </div>
      <div class="custom-sum-row">
        <button class="btn subtle" id="addAnotherNumBtn" data-i18n="btnAddNumber">+ Add another number</button>
        <button class="btn" id="useCustomAddBtn" data-i18n="btnUseSum">Use this sum</button>
      </div>
      <div class="custom-sum-error" id="customAddError"></div>
    </div>
    <div class="custom-sum-body hidden" data-op="sub" id="customBody-sub">
      <div class="custom-sum-fields">
        <div class="field"><label data-i18n="labelTopNumber">Top number</label><input type="text" inputmode="numeric" class="custom-num-input" id="customSubTop"></div>
        <div class="field"><label data-i18n="labelBottomNumber">Bottom number</label><input type="text" inputmode="numeric" class="custom-num-input" id="customSubBottom"></div>
      </div>
      <div class="custom-sum-row">
        <button class="btn" id="useCustomSubBtn" data-i18n="btnUseSum">Use this sum</button>
      </div>
      <div class="custom-sum-error" id="customSubError"></div>
    </div>
    <div class="custom-sum-body hidden" data-op="mul" id="customBody-mul">
      <div class="custom-sum-fields">

<script>
/* ---------------- helpers ---------------- */
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function randDigitsNumber(n){
  if(n<=0) return 0;
  let first=randInt(1,9);
  let rest='';
  for(let i=1;i<n;i++) rest+=randInt(0,9);
  return parseInt(first+String(rest),10);
}
function row(cols, extraClass){
  const r=document.createElement('div');
  r.className='grid-row '+(extraClass||'');
  r.style.gridTemplateColumns=`repeat(${cols}, var(--cellsize))`;
  return r;
}
function fixedCell(ch){
  const d=document.createElement('div');
  const blank = (ch===undefined || ch.trim()==='');
  d.className='cell fixed'+(blank?' blank':'');
  d.textContent = blank ? '' : ch;
  return d;
}
function blankCell(){
  const d=document.createElement('div');
  d.className='cell blank';
  return d;
}
function opCell(sym){
  const d=document.createElement('div');
  d.className='cell op-cell';
  d.textContent=sym||'';
  return d;
}
function editCell(){
  const inp=document.createElement('input');
  inp.className='cell input-cell';
  inp.maxLength=1;
  inp.setAttribute('inputmode','numeric');
  inp.setAttribute('autocomplete','off');
  return inp;
}
function makeCheck(input, expected, opts){
  opts=opts||{};
  return {input:input, expected:expected, blankZero: !!opts.blankZero, acceptAlt: opts.acceptAlt||[], group: opts.group||'answer'};
}
function gradeAll(checks){
  let allOk=true;
  checks.forEach(c=>{
    const val=c.input.value.trim();
    let ok;
    if(c.expected===null){ ok = (val===''||val==='0'); }
    else if(c.blankZero){ ok = (val===''?'0':val)===c.expected; }
    else { ok = val===c.expected; }
    if(!ok && val!=='' && c.acceptAlt.indexOf(val)!==-1){ ok=true; }
    c.input.classList.remove('correct','incorrect');
    void c.input.offsetWidth;
    c.input.classList.add(ok?'correct':'incorrect');
    c.input.disabled=true;
    if(!ok && c.group==='answer') allOk=false;
  });
  return allOk;
}
function setupInputNav(inputs){
  inputs.forEach((inp,idx)=>{
    inp.addEventListener('input', ()=>{
      inp.value = inp.value.replace(/[^0-9]/g,'').slice(-1);
      if(inp.value!==''){
        const next=inputs[idx+1];
        if(next) next.focus();
      }
    });
    inp.addEventListener('keydown',(e)=>{
      if(e.key==='Backspace' && inp.value===''){
        const prev=inputs[idx-1];
        if(prev) prev.focus();
      }
    });
  });
}

/* ---------------- addition ---------------- */
function addBlock(container, checks, inputs, numbers){
  const n=Math.max(...numbers.map(x=>x.toString().length));
  const strs=numbers.map(x=>x.toString().padStart(n,'0'));
  let carry=0; const digitsOut=new Array(n); const carryIn=new Array(n);
  for(let col=n-1; col>=0; col--){
    let sum=carry;
    for(const s2 of strs) sum+=parseInt(s2[col],10);
    carryIn[col]=carry;
    digitsOut[col]=sum%10;
    carry=Math.floor(sum/10);
  }
  const answerDigits = carry>0 ? [carry,...digitsOut] : digitsOut;
  const trueValue=parseInt(answerDigits.join(''),10);
  const W=answerDigits.length; const offset=W-n;

  const block=document.createElement('div'); block.className='block';

  const carryRow=row(W+1,'carry-row'); carryRow.appendChild(opCell(''));
  for(let c=0;c<W;c++){
    if(c<offset){ carryRow.appendChild(blankCell()); continue; }
    const localCol=c-offset;
    const inp=editCell();
    carryRow.appendChild(inp);
    checks.push(makeCheck(inp,String(carryIn[localCol]),{blankZero:true, group:'carry'}));
    inputs.push(inp);
  }
  block.appendChild(carryRow);

  numbers.forEach((num,i)=>{
    const r=row(W+1);
    r.appendChild(i===numbers.length-1 ? opCell('+') : opCell(''));
    const str=num.toString().padStart(W,' ');
    for(let c=0;c<W;c++) r.appendChild(fixedCell(str[c]));
    block.appendChild(r);
  });

  const ansRow=row(W+1,'answer-row'); ansRow.appendChild(opCell(''));
  const trueStr=trueValue.toString().padStart(W,'0');
  let firstSig=trueStr.search(/[1-9]/); if(firstSig===-1) firstSig=trueStr.length-1;
  for(let c=0;c<W;c++){
    const inp=editCell(); ansRow.appendChild(inp);
    const lenient=c<firstSig;
    checks.push(makeCheck(inp, trueStr[c], {blankZero:lenient}));
    inputs.push(inp);
  }
  block.appendChild(ansRow);
  container.appendChild(block);
  return {trueValue};
}
function renderAddition(container, s, checks, inputs){
  const numbers=[];
  for(let i=0;i<s.addends;i++) numbers.push(randDigitsNumber(s.digits));
  const r=addBlock(container, checks, inputs, numbers);
  return {title: numbers.join(' + ')+' = ?', answer:String(r.trueValue)};
}

/* ---------------- subtraction ---------------- */
function subBlock(container, checks, inputs, top, bottom){
  const n=top.toString().length;
  const W=n;
  const topStr=top.toString().padStart(n,'0');
  const bottomStr=bottom.toString().padStart(n,'0');
  let borrow=0; const digitsOut=new Array(n); const borrowFlag=new Array(n).fill(0); const incomingBorrow=new Array(n).fill(0);
  for(let col=n-1; col>=0; col--){
    incomingBorrow[col]=borrow;
    let t=parseInt(topStr[col],10)-borrow;
    const b=parseInt(bottomStr[col],10);
    if(t<b){ digitsOut[col]=t+10-b; borrow=1; } else { digitsOut[col]=t-b; borrow=0; }
    borrowFlag[col]=borrow;
  }
  const trueValue=parseInt(digitsOut.join(''),10);

  const block=document.createElement('div'); block.className='block';

  /* Two valid UK-classroom conventions for annotating a borrow, both accepted:
     (a) a simple "1" flag above a column that had to borrow, or
     (b) the crossed-out reduced digit written above a column that lent 1 to its right neighbour. */
  const bRow=row(W+1,'carry-row'); bRow.appendChild(opCell(''));
  for(let c=0;c<W;c++){
    const inp=editCell(); bRow.appendChild(inp);
    const flagVal = borrowFlag[c] ? '1' : '0';
    const reducedVal = String(parseInt(topStr[c],10) - incomingBorrow[c]);
    checks.push(makeCheck(inp, flagVal, {blankZero:true, acceptAlt:[reducedVal], group:'carry'}));
    inputs.push(inp);
  }
  block.appendChild(bRow);

  const topRow=row(W+1); topRow.appendChild(opCell(''));
  const topDisp=top.toString().padStart(W,' ');
  for(let c=0;c<W;c++) topRow.appendChild(fixedCell(topDisp[c]));
  block.appendChild(topRow);

  const botRow=row(W+1); botRow.appendChild(opCell('\u2212'));
  const botDisp=bottom.toString().padStart(W,' ');
  for(let c=0;c<W;c++) botRow.appendChild(fixedCell(botDisp[c]));
  block.appendChild(botRow);

  const ansRow=row(W+1,'answer-row'); ansRow.appendChild(opCell(''));
  const trueStr=trueValue.toString().padStart(W,'0');
  let firstSig=trueStr.search(/[1-9]/); if(firstSig===-1) firstSig=trueStr.length-1;
  for(let c=0;c<W;c++){
    const inp=editCell(); ansRow.appendChild(inp);
    checks.push(makeCheck(inp, trueStr[c], {blankZero:c<firstSig}));
    inputs.push(inp);
  }
  block.appendChild(ansRow);
  container.appendChild(block);
  return {trueValue};
}
function renderSubtraction(container, s, checks, inputs){
  let top=randDigitsNumber(s.topDigits);
  let bottom=randDigitsNumber(s.bottomDigits);
  if(bottom>top){ const t=top; top=bottom; bottom=t; }
  const r=subBlock(container, checks, inputs, top, bottom);
  return {title:`${top} \u2212 ${bottom} = ?`, answer:String(r.trueValue)};
}

/* ---------------- multiplication ---------------- */
function multBlock(container, checks, inputs, multiplicand, multiplierDigit, opSymbol, shift){
  shift = shift||0;
  const n=multiplicand.toString().length;
  const topStr=multiplicand.toString().padStart(n,'0');
  let carry=0; const digitsOut=new Array(n); const carryIn=new Array(n);
  for(let col=n-1; col>=0; col--){
    const d=parseInt(topStr[col],10);
    const prod=d*multiplierDigit+carry;
    carryIn[col]=carry;
    digitsOut[col]=prod%10;
    carry=Math.floor(prod/10);
  }
  const answerDigits = carry>0 ? [carry,...digitsOut] : digitsOut;
  const trueValue=parseInt(answerDigits.join(''),10);
  const W=answerDigits.length; const offset=W-n;
  const totalW = W+shift;

  const block=document.createElement('div'); block.className='block';

  const cRow=row(totalW+1,'carry-row'); cRow.appendChild(opCell(''));
  for(let c=0;c<W;c++){
    if(c<offset){ cRow.appendChild(blankCell()); continue; }
    const localCol=c-offset;
    const inp=editCell(); cRow.appendChild(inp);
    checks.push(makeCheck(inp, String(carryIn[localCol]), {blankZero:true, group:'carry'}));
    inputs.push(inp);
  }
  for(let i=0;i<shift;i++) cRow.appendChild(blankCell());
  block.appendChild(cRow);

  const topRow=row(totalW+1); topRow.appendChild(opCell(''));
  const topDisp=multiplicand.toString().padStart(W,' ');
  for(let c=0;c<W;c++) topRow.appendChild(fixedCell(topDisp[c]));
  for(let i=0;i<shift;i++) topRow.appendChild(blankCell());
  block.appendChild(topRow);

  const mulRow=row(totalW+1); mulRow.appendChild(opCell(opSymbol||'\u00d7'));
  const mulDisp=String(multiplierDigit).padStart(W,' ');
  for(let c=0;c<W;c++) mulRow.appendChild(fixedCell(mulDisp[c]));
  for(let i=0;i<shift;i++) mulRow.appendChild(blankCell());
  block.appendChild(mulRow);

  const ansRow=row(totalW+1,'answer-row'); ansRow.appendChild(opCell(''));
  const trueStr=trueValue.toString().padStart(W,'0');
  let firstSig=trueStr.search(/[1-9]/); if(firstSig===-1) firstSig=trueStr.length-1;
  for(let c=0;c<W;c++){
    const inp=editCell(); ansRow.appendChild(inp);
    checks.push(makeCheck(inp, trueStr[c], {blankZero:c<firstSig}));
    inputs.push(inp);
  }
  for(let i=0;i<shift;i++){
    const inp=editCell(); inp.classList.add('placeholder-cell'); ansRow.appendChild(inp);
    checks.push(makeCheck(inp,'0',{blankZero:true}));
    inputs.push(inp);
  }
  block.appendChild(ansRow);
  container.appendChild(block);
  return {trueValue};
}
function wholeMultBlock(container, checks, inputs, multiplicand, multiplier){
  const trueValue = multiplicand * multiplier;
  const trueStr = trueValue.toString();
  const W = Math.max(multiplicand.toString().length, multiplier.toString().length, trueStr.length);

  const block=document.createElement('div'); block.className='block';

  const topRow=row(W+1); topRow.appendChild(opCell(''));
  const topDisp=multiplicand.toString().padStart(W,' ');
  for(let c=0;c<W;c++) topRow.appendChild(fixedCell(topDisp[c]));
  block.appendChild(topRow);

  const mulRow=row(W+1); mulRow.appendChild(opCell('\u00d7'));
  const mulDisp=multiplier.toString().padStart(W,' ');
  for(let c=0;c<W;c++) mulRow.appendChild(fixedCell(mulDisp[c]));
  block.appendChild(mulRow);

  const ansRow=row(W+1,'answer-row'); ansRow.appendChild(opCell(''));
  const trueStrPadded=trueValue.toString().padStart(W,'0');
  let firstSig=trueStrPadded.search(/[1-9]/); if(firstSig===-1) firstSig=trueStrPadded.length-1;
  for(let c=0;c<W;c++){
    const inp=editCell(); ansRow.appendChild(inp);
    checks.push(makeCheck(inp, trueStrPadded[c], {blankZero:c<firstSig}));
    inputs.push(inp);
  }
  block.appendChild(ansRow);
  container.appendChild(block);
  return {trueValue};
}
function buildMultiplication(container, checks, inputs, multiplicand, multiplier, method){
  let finalAnswer;
  const multiplierStr=multiplier.toString();
  const numDigits=multiplierStr.length;
  if(method==='whole'){
    const r=wholeMultBlock(container, checks, inputs, multiplicand, multiplier);
    finalAnswer=r.trueValue;
  } else if(numDigits===1){
    const r=multBlock(container, checks, inputs, multiplicand, multiplier, '\u00d7', 0);
    finalAnswer=r.trueValue;
  } else {
    const partials=[];
    for(let i=0;i<numDigits;i++){
      const digit=parseInt(multiplierStr[numDigits-1-i],10);
      const step=document.createElement('div');
      const label = i===0 ? stepOnesLabel(i+1, digit) : stepPlaceLabel(i+1, i, digit);
      step.innerHTML=`<div class="step-label"></div>`;
      step.querySelector('.step-label').textContent = label;
      container.appendChild(step);
      const r=multBlock(step, checks, inputs, multiplicand, digit, '\u00d7', i);
      partials.push(r.trueValue * Math.pow(10,i));
    }
    const finalStep=document.createElement('div');
    finalStep.innerHTML=`<div class="step-label"></div>`;
    finalStep.querySelector('.step-label').textContent = stepAddLabel(numDigits+1, numDigits);
    container.appendChild(finalStep);
    const rFinal=addBlock(finalStep, checks, inputs, partials);
    finalAnswer=rFinal.trueValue;
  }
  return {finalAnswer};
}
function renderMultiplication(container, s, checks, inputs){
  const multiplicand=randDigitsNumber(s.mcDigits);
  const multiplier=randDigitsNumber(s.mrDigits);
  const r=buildMultiplication(container, checks, inputs, multiplicand, multiplier, s.method);
  return {title:`${multiplicand} \u00d7 ${multiplier} = ?`, answer:String(r.finalAnswer)};
}


/* ---------------- division ---------------- */
function simulateLongDivision(dividendStr, divisor){
  let remainder=0;
  const steps=[];
  for(let i=0;i<dividendStr.length;i++){
    const digit=parseInt(dividendStr[i],10);
    const workingBefore=remainder*10+digit;
    const qDigit=Math.floor(workingBefore/divisor);
    const product=qDigit*divisor;
    const remainderAfter=workingBefore-product;
    steps.push({digit, workingBefore, qDigit, product, remainderAfter});
    remainder=remainderAfter;
  }
  return {steps, finalRemainder:remainder};
}
function divisionStepBlock(container, checks, inputs, workingNumber, product, remainder){
  const W=Math.max(String(workingNumber).length, String(product).length, 1);
  const block=document.createElement('div'); block.className='block';

  const topRow=row(W+1); topRow.appendChild(opCell(''));
  const topDisp=String(workingNumber).padStart(W,' ');
  for(let c=0;c<W;c++) topRow.appendChild(fixedCell(topDisp[c]));
  block.appendChild(topRow);

  const prodRow=row(W+1); prodRow.appendChild(opCell('\u2212'));
  const prodStr=String(product).padStart(W,'0');
  let prodFirstSig=prodStr.search(/[1-9]/); if(prodFirstSig===-1) prodFirstSig=prodStr.length-1;
  for(let c=0;c<W;c++){
    const inp=editCell(); prodRow.appendChild(inp);
    checks.push(makeCheck(inp, prodStr[c], {blankZero:c<prodFirstSig}));
    inputs.push(inp);
  }
  block.appendChild(prodRow);

  const remRow=row(W+1,'answer-row'); remRow.appendChild(opCell(''));
  const remStr=String(remainder).padStart(W,'0');
  let remFirstSig=remStr.search(/[1-9]/); if(remFirstSig===-1) remFirstSig=remStr.length-1;
  for(let c=0;c<W;c++){
    const inp=editCell(); remRow.appendChild(inp);
    checks.push(makeCheck(inp, remStr[c], {blankZero:c<remFirstSig}));
    inputs.push(inp);
  }
  block.appendChild(remRow);
  container.appendChild(block);
}
function buildDivision(container, checks, inputs, dividend, divisor, method){
  const dividendStr=dividend.toString();
  const W=dividendStr.length;

  const {steps, finalRemainder}=simulateLongDivision(dividendStr, divisor);
  const quotientDigitsStr=steps.map(st=>st.qDigit).join('');
  let qOffset=quotientDigitsStr.search(/[1-9]/); if(qOffset===-1) qOffset=quotientDigitsStr.length-1;
  const quotient=parseInt(quotientDigitsStr,10);
  const remainder=finalRemainder;

  const block=document.createElement('div'); block.className='block division-block';

  const qRow=row(W+1,'answer-row division-quotient'); qRow.appendChild(opCell(''));
  for(let c=0;c<W;c++){
    const inp=editCell(); qRow.appendChild(inp);
    if(c<qOffset){ checks.push(makeCheck(inp,null,{})); }
    else { checks.push(makeCheck(inp, quotientDigitsStr[c], {blankZero:false})); }
    inputs.push(inp);
  }
  block.appendChild(qRow);

  const dRow=row(W+1,'division-main');
  const divCell=document.createElement('div'); divCell.className='cell divisor-cell'; divCell.textContent=divisor;
  dRow.appendChild(divCell);
  for(let c=0;c<W;c++){
    const cell=fixedCell(dividendStr[c]); cell.classList.add('bracket-top');
    dRow.appendChild(cell);
  }
  block.appendChild(dRow);
  container.appendChild(block);

  if(method==='steps'){
    for(let i=qOffset;i<steps.length;i++){
      const st=steps[i];
      const stepWrap=document.createElement('div');
      stepWrap.innerHTML=`<div class="step-label"></div>`;
      stepWrap.querySelector('.step-label').textContent = divStepLabel(i-qOffset+1, st.workingBefore, divisor);
      container.appendChild(stepWrap);
      divisionStepBlock(stepWrap, checks, inputs, st.workingBefore, st.product, st.remainderAfter);
    }
  }

  const remWrap=document.createElement('div'); remWrap.className='remainder-line';
  remWrap.appendChild(document.createTextNode(t('labelRemainder')+' '));
  const remInput=editCell(); remWrap.appendChild(remInput);
  checks.push(makeCheck(remInput, String(remainder), {blankZero: remainder===0}));
  inputs.push(remInput);
  container.appendChild(remWrap);

  return {quotient, remainder};
}
function renderDivision(container, s, checks, inputs){
  let divisor=randDigitsNumber(s.divisorDigits);
  if(divisor<2) divisor=2;
  let dividend;
  if(s.exact){
    const qDigits=Math.max(1, s.dividendDigits - s.divisorDigits + 1);
    const quotient=randDigitsNumber(qDigits);
    dividend=quotient*divisor;
  } else {
    dividend=randDigitsNumber(s.dividendDigits);
  }
  const r=buildDivision(container, checks, inputs, dividend, divisor, s.method);
  return {title:`${dividend} \u00f7 ${divisor} = ?`, answer: r.remainder? `${r.quotient} ${t('labelRemainder')} ${r.remainder}` : String(r.quotient)};
}

      add:['\u0395\u03c5\u03b8\u03c5\u03b3\u03c1\u03ac\u03bc\u03b9\u03c3\u03b5 \u03c4\u03bf\u03c5\u03c2 \u03b1\u03c1\u03b9\u03b8\u03bc\u03bf\u03cd\u03c2 \u03b4\u03b5\u03be\u03b9\u03ac, \u03bc\u03bf\u03bd\u03ac\u03b4\u03b5\u03c2 \u03ba\u03ac\u03c4\u03c9 \u03b1\u03c0\u03cc \u03bc\u03bf\u03bd\u03ac\u03b4\u03b5\u03c2, \u03b4\u03b5\u03ba\u03ac\u03b4\u03b5\u03c2 \u03ba\u03ac\u03c4\u03c9 \u03b1\u03c0\u03cc \u03b4\u03b5\u03ba\u03ac\u03b4\u03b5\u03c2.','\u03a0\u03c1\u03cc\u03c3\u03b8\u03b5\u03c3\u03b5 \u03c0\u03c1\u03ce\u03c4\u03b1 \u03c4\u03b7 \u03b4\u03b5\u03be\u03b9\u03ac \u03c3\u03c4\u03ae\u03bb\u03b7 (\u03bc\u03bf\u03bd\u03ac\u03b4\u03b5\u03c2).','\u0391\u03bd \u03c4\u03bf \u03ac\u03b8\u03c1\u03bf\u03b9\u03c3\u03bc\u03b1 \u03b5\u03af\u03bd\u03b1\u03b9 10 \u03ae \u03c0\u03b5\u03c1\u03b9\u03c3\u03c3\u03cc\u03c4\u03b5\u03c1\u03bf, \u03b3\u03c1\u03ac\u03c8\u03b5 \u03c4\u03bf \u03c8\u03b7\u03c6\u03af\u03bf \u03c4\u03c9\u03bd \u03bc\u03bf\u03bd\u03ac\u03b4\u03c9\u03bd \u03c3\u03c4\u03b7\u03bd \u03b1\u03c0\u03ac\u03bd\u03c4\u03b7\u03c3\u03b7 \u03ba\u03b1\u03b9 \u03bc\u03b5\u03c4\u03ad\u03c6\u03b5\u03c1\u03b5 \u03c4\u03bf \u03ba\u03c1\u03b1\u03c4\u03bf\u03cd\u03bc\u03b5\u03bd\u03bf \u03c3\u03c4\u03bf \u03bc\u03b9\u03ba\u03c1\u03cc \u03ba\u03bf\u03c5\u03c4\u03af \u03c0\u03ac\u03bd\u03c9 \u03b1\u03c0\u03cc \u03c4\u03b7\u03bd \u03b5\u03c0\u03cc\u03bc\u03b5\u03bd\u03b7 \u03c3\u03c4\u03ae\u03bb\u03b7.','\u03a0\u03c1\u03cc\u03c3\u03b8\u03b5\u03c3\u03b5 \u03c4\u03b7\u03bd \u03b5\u03c0\u03cc\u03bc\u03b5\u03bd\u03b7 \u03c3\u03c4\u03ae\u03bb\u03b7, \u03bc\u03b1\u03b6\u03af \u03bc\u03b5 \u03c4\u03c5\u03c7\u03cc\u03bd \u03ba\u03c1\u03b1\u03c4\u03bf\u03cd\u03bc\u03b5\u03bd\u03bf, \u03ba\u03b1\u03b9 \u03c3\u03c5\u03bd\u03ad\u03c7\u03b9\u03c3\u03b5 \u03bc\u03ad\u03c7\u03c1\u03b9 \u03bd\u03b1 \u03c4\u03b5\u03bb\u03b5\u03b9\u03ce\u03c3\u03bf\u03c5\u03bd \u03cc\u03bb\u03b5\u03c2 \u03bf\u03b9 \u03c3\u03c4\u03ae\u03bb\u03b5\u03c2.','\u0391\u03bd \u03bc\u03b5\u03af\u03bd\u03b5\u03b9 \u03ba\u03c1\u03b1\u03c4\u03bf\u03cd\u03bc\u03b5\u03bd\u03bf \u03bc\u03b5\u03c4\u03ac \u03c4\u03b7\u03bd \u03c4\u03b5\u03bb\u03b5\u03c5\u03c4\u03b1\u03af\u03b1 \u03c3\u03c4\u03ae\u03bb\u03b7, \u03b3\u03af\u03bd\u03b5\u03c4\u03b1\u03b9 \u03bd\u03ad\u03bf \u03c8\u03b7\u03c6\u03af\u03bf \u03c3\u03c4\u03b7\u03bd \u03b1\u03c1\u03c7\u03ae \u03c4\u03b7\u03c2 \u03b1\u03c0\u03ac\u03bd\u03c4\u03b7\u03c3\u03b7\u03c2.'],
      sub:['\u0395\u03c5\u03b8\u03c5\u03b3\u03c1\u03ac\u03bc\u03b9\u03c3\u03b5 \u03c4\u03bf\u03c5\u03c2 \u03b1\u03c1\u03b9\u03b8\u03bc\u03bf\u03cd\u03c2 \u03b4\u03b5\u03be\u03b9\u03ac, \u03bc\u03bf\u03bd\u03ac\u03b4\u03b5\u03c2 \u03ba\u03ac\u03c4\u03c9 \u03b1\u03c0\u03cc \u03bc\u03bf\u03bd\u03ac\u03b4\u03b5\u03c2, \u03b4\u03b5\u03ba\u03ac\u03b4\u03b5\u03c2 \u03ba\u03ac\u03c4\u03c9 \u03b1\u03c0\u03cc \u03b4\u03b5\u03ba\u03ac\u03b4\u03b5\u03c2.','\u0391\u03c6\u03b1\u03af\u03c1\u03b5\u03c3\u03b5 \u03c0\u03c1\u03ce\u03c4\u03b1 \u03c4\u03b7 \u03b4\u03b5\u03be\u03b9\u03ac \u03c3\u03c4\u03ae\u03bb\u03b7.','\u0391\u03bd \u03c4\u03bf \u03c0\u03ac\u03bd\u03c9 \u03c8\u03b7\u03c6\u03af\u03bf \u03b5\u03af\u03bd\u03b1\u03b9 \u03bc\u03b9\u03ba\u03c1\u03cc\u03c4\u03b5\u03c1\u03bf \u03b1\u03c0\u03cc \u03c4\u03bf \u03ba\u03ac\u03c4\u03c9, \u03b4\u03b1\u03bd\u03b5\u03af\u03c3\u03bf\u03c5 1 \u03b1\u03c0\u03cc \u03c4\u03b7\u03bd \u03b1\u03c1\u03b9\u03c3\u03c4\u03b5\u03c1\u03ae \u03c3\u03c4\u03ae\u03bb\u03b7 \u03ba\u03b1\u03b9 \u03c0\u03c1\u03cc\u03c3\u03b8\u03b5\u03c3\u03b5 10 \u03c3\u03c4\u03bf \u03c8\u03b7\u03c6\u03af\u03bf \u03c0\u03bf\u03c5 \u03b1\u03c6\u03b1\u03b9\u03c1\u03b5\u03af\u03c2. \u03a3\u03c4\u03bf \u03bc\u03b9\u03ba\u03c1\u03cc \u03ba\u03bf\u03c5\u03c4\u03af \u03c0\u03ac\u03bd\u03c9 \u03b1\u03c0\u03cc \u03c4\u03b7 \u03c3\u03c4\u03ae\u03bb\u03b7 \u03c0\u03bf\u03c5 \u03b4\u03b1\u03bd\u03b5\u03af\u03c3\u03c4\u03b7\u03ba\u03b5\u03c2, \u03bc\u03c0\u03bf\u03c1\u03b5\u03af\u03c2 \u03bd\u03b1 \u03b3\u03c1\u03ac\u03c8\u03b5\u03b9\u03c2 \u03ad\u03bd\u03b1 \u03bc\u03b9\u03ba\u03c1\u03cc 1 \u03ae \u03bd\u03b1 \u03b4\u03b9\u03b1\u03b3\u03c1\u03ac\u03c8\u03b5\u03b9\u03c2 \u03ba\u03b1\u03b9 \u03bd\u03b1 \u03b3\u03c1\u03ac\u03c8\u03b5\u03b9\u03c2 \u03c4\u03bf \u03bd\u03ad\u03bf, \u03bc\u03b5\u03b9\u03c9\u03bc\u03ad\u03bd\u03bf \u03c8\u03b7\u03c6\u03af\u03bf \u2014 \u03ba\u03b1\u03b9 \u03c4\u03b1 \u03b4\u03cd\u03bf \u03bc\u03b5\u03c4\u03c1\u03ac\u03bd\u03b5 \u03c3\u03c9\u03c3\u03c4\u03ac.','\u03a3\u03c5\u03bd\u03ad\u03c7\u03b9\u03c3\u03b5 \u03c3\u03b5 \u03ba\u03ac\u03b8\u03b5 \u03c3\u03c4\u03ae\u03bb\u03b7, \u03c7\u03c1\u03b7\u03c3\u03b9\u03bc\u03bf\u03c0\u03bf\u03b9\u03ce\u03bd\u03c4\u03b1\u03c2 \u03c4\u03c5\u03c7\u03cc\u03bd \u03b4\u03b1\u03bd\u03b5\u03b9\u03ba\u03ac \u03cc\u03c0\u03bf\u03c5 \u03c7\u03c1\u03b5\u03b9\u03ac\u03b6\u03b5\u03c4\u03b1\u03b9.','\u03a4\u03b1 \u03c8\u03b7\u03c6\u03af\u03b1 \u03c0\u03bf\u03c5 \u03bc\u03ad\u03bd\u03bf\u03c5\u03bd \u03ba\u03ac\u03c4\u03c9, \u03b1\u03c0\u03cc \u03b1\u03c1\u03b9\u03c3\u03c4\u03b5\u03c1\u03ac \u03c0\u03c1\u03bf\u03c2 \u03c4\u03b1 \u03b4\u03b5\u03be\u03b9\u03ac, \u03b5\u03af\u03bd\u03b1\u03b9 \u03b7 \u03b1\u03c0\u03ac\u03bd\u03c4\u03b7\u03c3\u03ae \u03c3\u03bf\u03c5.'],
      mul:['\u0393\u03c1\u03ac\u03c8\u03b5 \u03c4\u03bf\u03bd \u03bc\u03b5\u03b3\u03b1\u03bb\u03cd\u03c4\u03b5\u03c1\u03bf \u03b1\u03c1\u03b9\u03b8\u03bc\u03cc \u03c0\u03ac\u03bd\u03c9 \u03ba\u03b1\u03b9 \u03c4\u03bf\u03bd \u03c0\u03bf\u03bb\u03bb\u03b1\u03c0\u03bb\u03b1\u03c3\u03b9\u03b1\u03c3\u03c4\u03ae \u03b1\u03c0\u03cc \u03ba\u03ac\u03c4\u03c9, \u03b5\u03c5\u03b8\u03c5\u03b3\u03c1\u03b1\u03bc\u03bc\u03b9\u03c3\u03bc\u03ad\u03bd\u03bf\u03c5\u03c2 \u03b4\u03b5\u03be\u03b9\u03ac.','\u0391\u03bd \u03bf \u03c0\u03bf\u03bb\u03bb\u03b1\u03c0\u03bb\u03b1\u03c3\u03b9\u03b1\u03c3\u03c4\u03ae\u03c2 \u03ad\u03c7\u03b5\u03b9 \u03ad\u03bd\u03b1 \u03c8\u03b7\u03c6\u03af\u03bf: \u03c0\u03bf\u03bb\u03bb\u03b1\u03c0\u03bb\u03b1\u03c3\u03af\u03b1\u03c3\u03ad \u03c4\u03bf \u03bc\u03b5 \u03ba\u03ac\u03b8\u03b5 \u03c8\u03b7\u03c6\u03af\u03bf \u03c4\u03bf\u03c5 \u03c0\u03ac\u03bd\u03c9 \u03b1\u03c1\u03b9\u03b8\u03bc\u03bf\u03cd, \u03be\u03b5\u03ba\u03b9\u03bd\u03ce\u03bd\u03c4\u03b1\u03c2 \u03b1\u03c0\u03cc \u03c4\u03b1 \u03b4\u03b5\u03be\u03b9\u03ac, \u03bc\u03b5\u03c4\u03b1\u03c6\u03ad\u03c1\u03bf\u03bd\u03c4\u03b1\u03c2 \u03c4\u03b9\u03c2 \u03b4\u03b5\u03ba\u03ac\u03b4\u03b5\u03c2 \u03c3\u03c4\u03bf \u03ba\u03bf\u03c5\u03c4\u03af \u03c0\u03ac\u03bd\u03c9 \u03b1\u03c0\u03cc \u03c4\u03b7\u03bd \u03b5\u03c0\u03cc\u03bc\u03b5\u03bd\u03b7 \u03c3\u03c4\u03ae\u03bb\u03b7, \u03cc\u03c0\u03c9\u03c2 \u03c3\u03c4\u03b7\u03bd \u03c0\u03c1\u03cc\u03c3\u03b8\u03b5\u03c3\u03b7.','\u0391\u03bd \u03bf \u03c0\u03bf\u03bb\u03bb\u03b1\u03c0\u03bb\u03b1\u03c3\u03b9\u03b1\u03c3\u03c4\u03ae\u03c2 \u03ad\u03c7\u03b5\u03b9 \u03c0\u03b5\u03c1\u03b9\u03c3\u03c3\u03cc\u03c4\u03b5\u03c1\u03b1 \u03c8\u03b7\u03c6\u03af\u03b1: \u03c0\u03bf\u03bb\u03bb\u03b1\u03c0\u03bb\u03b1\u03c3\u03af\u03b1\u03c3\u03b5 \u03c0\u03c1\u03ce\u03c4\u03b1 \u03bc\u03b5 \u03c4\u03bf \u03c8\u03b7\u03c6\u03af\u03bf \u03c4\u03c9\u03bd \u03bc\u03bf\u03bd\u03ac\u03b4\u03c9\u03bd (\u0392\u03ae\u03bc\u03b1 1), \u03bc\u03b5\u03c4\u03ac \u03bc\u03b5 \u03c4\u03bf \u03c8\u03b7\u03c6\u03af\u03bf \u03c4\u03c9\u03bd \u03b4\u03b5\u03ba\u03ac\u03b4\u03c9\u03bd \u03bc\u03b5\u03c4\u03b1\u03c4\u03bf\u03c0\u03b9\u03c3\u03bc\u03ad\u03bd\u03bf \u03bc\u03af\u03b1 \u03b8\u03ad\u03c3\u03b7 \u03b1\u03c1\u03b9\u03c3\u03c4\u03b5\u03c1\u03ac (\u0392\u03ae\u03bc\u03b1 2), \u03ba\u03b1\u03b9 \u03bf\u03cd\u03c4\u03c9 \u03ba\u03b1\u03b8\u03b5\u03be\u03ae\u03c2 \u2014 \u03ad\u03bd\u03b1 \u03b2\u03ae\u03bc\u03b1 \u03b1\u03bd\u03ac \u03c8\u03b7\u03c6\u03af\u03bf. \u039c\u03c0\u03bf\u03c1\u03b5\u03af\u03c2 \u03bd\u03b1 \u03b3\u03c1\u03ac\u03c8\u03b5\u03b9\u03c2 0 \u03b3\u03b9\u03b1 \u03c4\u03b7 \u03bc\u03b5\u03c4\u03b1\u03c4\u03cc\u03c0\u03b9\u03c3\u03b7 \u03ae \u03bd\u03b1 \u03c4\u03bf \u03b1\u03c6\u03ae\u03c3\u03b5\u03b9\u03c2 \u03ba\u03b5\u03bd\u03cc \u2014 \u03ba\u03b1\u03b9 \u03c4\u03b1 \u03b4\u03cd\u03bf \u03bc\u03b5\u03c4\u03c1\u03ac\u03bd\u03b5 \u03c3\u03c9\u03c3\u03c4\u03ac.','\u03a4\u03ad\u03bb\u03bf\u03c2, \u03c0\u03c1\u03cc\u03c3\u03b8\u03b5\u03c3\u03b5 \u03cc\u03bb\u03b5\u03c2 \u03c4\u03b9\u03c2 \u03b3\u03c1\u03b1\u03bc\u03bc\u03ad\u03c2 \u03c4\u03c9\u03bd \u03b2\u03b7\u03bc\u03ac\u03c4\u03c9\u03bd \u03b3\u03b9\u03b1 \u03bd\u03b1 \u03b2\u03c1\u03b5\u03b9\u03c2 \u03c4\u03b7\u03bd \u03b1\u03c0\u03ac\u03bd\u03c4\u03b7\u03c3\u03b7 (\u03c4\u03bf \u03c4\u03b5\u03bb\u03b5\u03c5\u03c4\u03b1\u03af\u03bf \u03b2\u03ae\u03bc\u03b1).'],
      div:['\u0393\u03c1\u03ac\u03c8\u03b5 \u03c4\u03bf\u03bd \u03b1\u03c1\u03b9\u03b8\u03bc\u03cc \u03c0\u03bf\u03c5 \u03b4\u03b9\u03b1\u03b9\u03c1\u03b5\u03af\u03c2 (\u03c4\u03bf\u03bd \u03b4\u03b9\u03b1\u03b9\u03c1\u03b5\u03c4\u03ad\u03bf) \u03ba\u03ac\u03c4\u03c9 \u03b1\u03c0\u03cc \u03c4\u03bf \u03c3\u03cd\u03bc\u03b2\u03bf\u03bb\u03bf \u03c4\u03b7\u03c2 \u03b4\u03b9\u03b1\u03af\u03c1\u03b5\u03c3\u03b7\u03c2, \u03ba\u03b1\u03b9 \u03c4\u03bf\u03bd \u03b4\u03b9\u03b1\u03b9\u03c1\u03ad\u03c4\u03b7 \u03b1\u03c1\u03b9\u03c3\u03c4\u03b5\u03c1\u03ac.','\u039e\u03b5\u03ba\u03b9\u03bd\u03ce\u03bd\u03c4\u03b1\u03c2 \u03b1\u03c0\u03cc \u03c4\u03b1 \u03b1\u03c1\u03b9\u03c3\u03c4\u03b5\u03c1\u03ac, \u03b4\u03b5\u03c2 \u03c0\u03cc\u03c3\u03b5\u03c2 \u03c6\u03bf\u03c1\u03ad\u03c2 \u03c7\u03c9\u03c1\u03ac\u03b5\u03b9 \u03bf \u03b4\u03b9\u03b1\u03b9\u03c1\u03ad\u03c4\u03b7\u03c2 \u03c3\u03c4\u03bf \u03c0\u03c1\u03ce\u03c4\u03bf \u03c8\u03b7\u03c6\u03af\u03bf (\u03ae \u03c4\u03b1 \u03c0\u03c1\u03ce\u03c4\u03b1 \u03c8\u03b7\u03c6\u03af\u03b1) \u03c7\u03c9\u03c1\u03af\u03c2 \u03bd\u03b1 \u03c4\u03bf \u03be\u03b5\u03c0\u03b5\u03c1\u03ac\u03c3\u03b5\u03b9.','\u0393\u03c1\u03ac\u03c8\u03b5 \u03b1\u03c5\u03c4\u03cc\u03bd \u03c4\u03bf\u03bd \u03b1\u03c1\u03b9\u03b8\u03bc\u03cc \u03c0\u03ac\u03bd\u03c9 \u03b1\u03c0\u03cc \u03c4\u03bf \u03c3\u03cd\u03bc\u03b2\u03bf\u03bb\u03bf \u2014 \u03b5\u03af\u03bd\u03b1\u03b9 \u03ad\u03bd\u03b1 \u03c8\u03b7\u03c6\u03af\u03bf \u03c4\u03b7\u03c2 \u03b1\u03c0\u03ac\u03bd\u03c4\u03b7\u03c3\u03ae\u03c2 \u03c3\u03bf\u03c5 (\u03c4\u03bf \u03c0\u03b7\u03bb\u03af\u03ba\u03bf).','\u03a7\u03c1\u03b7\u03c3\u03b9\u03bc\u03bf\u03c0\u03bf\u03af\u03b7\u03c3\u03b5 \u03c4\u03bf \u03c0\u03c1\u03cc\u03c7\u03b5\u03b9\u03c1\u03bf \u03c0\u03b1\u03c1\u03b1\u03ba\u03ac\u03c4\u03c9 \u03b3\u03b9\u03b1 \u03bd\u03b1 \u03ba\u03ac\u03bd\u03b5\u03b9\u03c2 \u03c4\u03b7\u03bd \u03b1\u03c6\u03b1\u03af\u03c1\u03b5\u03c3\u03b7 \u03ba\u03b1\u03b9 \u03bd\u03b1 \u03ba\u03b1\u03c4\u03b5\u0     howto:{
      add:['Aligne les nombres \u00e0 droite, unit\u00e9s sous unit\u00e9s, dizaines sous dizaines.',"Additionne d'abord la colonne de droite (les unit\u00e9s).",'Si le total est 10 ou plus, \u00e9cris le chiffre des unit\u00e9s dans la r\u00e9ponse et reporte la dizaine dans la petite case au-dessus de la colonne suivante.','Additionne la colonne suivante, en incluant toute retenue, et continue jusqu\u2019\u00e0 la fin.','S\u2019il reste une retenue apr\u00e8s la derni\u00e8re colonne, elle devient un nouveau chiffre au d\u00e9but de la r\u00e9ponse.'],
      sub:['Aligne les nombres \u00e0 droite, unit\u00e9s sous unit\u00e9s, dizaines sous dizaines.',"Soustrais d'abord la colonne de droite.",'Si le chiffre du haut est plus petit que celui du bas, emprunte 1 \u00e0 la colonne de gauche et ajoute 10 au chiffre que tu soustrais. Dans la petite case au-dessus de la colonne emprunt\u00e9e, tu peux \u00e9crire soit un petit 1, soit barrer et \u00e9crire son nouveau chiffre r\u00e9duit \u2014 les deux sont accept\u00e9s.','Continue colonne par colonne, en utilisant les emprunts au fur et \u00e0 mesure.','Les chiffres restants en bas, lus de gauche \u00e0 droite, forment ta r\u00e9ponse.'],
      mul:['\u00c9cris le plus grand nombre en haut et le multiplicateur en dessous, align\u00e9s \u00e0 droite.','Si le multiplicateur a un chiffre\u00a0: multiplie-le par chaque chiffre du nombre du haut, en partant de la droite, en reportant les dizaines dans la case au-dessus de la colonne suivante, comme pour l\u2019addition.','Si le multiplicateur a plusieurs chiffres\u00a0: multiplie d\u2019abord par son chiffre des unit\u00e9s (\u00c9tape 1), puis par celui des dizaines d\u00e9cal\u00e9 d\u2019une place vers la gauche (\u00c9tape 2), puis celui des centaines d\u00e9cal\u00e9 de deux places (\u00c9tape 3), et ainsi de suite \u2014 une \u00e9tape par chiffre. Tu peux \u00e9crire un 0 pour chaque d\u00e9calage ou le laisser vide, les deux sont accept\u00e9s.','Enfin, additionne toutes les lignes des \u00e9tapes pour obtenir la r\u00e9ponse (la derni\u00e8re \u00e9tape).'],
      div:['\u00c9cris le nombre \u00e0 diviser (le dividende) sous la potence, et le diviseur \u00e0 gauche.','En partant de la gauche, regarde combien de fois le diviseur entre dans le premier chiffre (ou les premiers chiffres) sans d\u00e9passer.','\u00c9cris ce nombre au-dessus de la potence \u2014 c\u2019est un chiffre de ta r\u00e9ponse (le quotient).','Utilise le brouillon ci-dessous pour faire la soustraction et abaisser le chiffre suivant, comme sur papier.','Continue jusqu\u2019\u00e0 avoir abaiss\u00e9 tous les chiffres. Ce qui reste \u00e0 la fin est le reste.']

      add:['Schreibe die Zahlen rechtsb\u00fcndig untereinander, Einer unter Einer, Zehner unter Zehner.','Addiere zuerst die rechte Spalte (die Einer).','Ist die Summe 10 oder mehr, schreibe die Einerziffer in die Antwort und trage die Zehnerziffer als \u00dcbertrag in das kleine K\u00e4stchen \u00fcber der n\u00e4chsten Spalte ein.','Addiere die n\u00e4chste Spalte samt \u00dcbertrag und mache so weiter, bis alle Spalten fertig sind.','Bleibt nach der letzten Spalte ein \u00dcbertrag \u00fcbrig, wird er zur neuen ersten Ziffer der Antwort.'],
      sub:['Schreibe die Zahlen rechtsb\u00fcndig untereinander, Einer unter Einer, Zehner unter Zehner.','Subtrahiere zuerst die rechte Spalte.','Ist die obere Ziffer kleiner als die untere, leihe dir 1 von der Spalte links und addiere 10 zur Ziffer, von der du abziehst. In das kleine K\u00e4stchen \u00fcber der Spalte, von der du geliehen hast, kannst du entweder eine kleine 1 schreiben oder die Ziffer durchstreichen und die neue, verringerte Ziffer notieren \u2014 beides z\u00e4hlt als richtig.','Arbeite dich Spalte f\u00fcr Spalte weiter, mit den \u00dcbertr\u00e4gen, sobald du sie brauchst.','Die Ziffern unten, von links nach rechts gelesen, sind deine Antwort.'],
      mul:['Schreibe die gr\u00f6\u00dfere Zahl oben und den Multiplikator darunter, rechtsb\u00fcndig.','Hat der Multiplikator eine Stelle: multipliziere sie mit jeder Ziffer der oberen Zahl, beginnend von rechts, und trage Zehner als \u00dcbertrag in das K\u00e4stchen \u00fcber der n\u00e4chsten Spalte ein, genau wie bei der Addition.','Hat der Multiplikator mehrere Stellen: multipliziere zuerst mit der Einerziffer (Schritt 1), dann mit der Zehnerziffer, eine Stelle nach links verschoben (Schritt 2), dann mit der Hunderterziffer, zwei Stellen verschoben (Schritt 3), und so weiter \u2014 ein Schritt pro Stelle. Du kannst f\u00fcr jede Verschiebung eine 0 schreiben oder das Feld leer lassen, beides z\u00e4hlt als richtig.','Zum Schluss addierst du alle Zeilen der Schritte, um die Antwort zu erhalten (der letzte Schritt).'],
      div:['Schreibe die Zahl, die du teilst (den Dividenden), unter den Divisionshaken, und den Divisor links davon.','Pr\u00fcfe von links, wie oft der Divisor in die erste Ziffer (oder die ersten Ziffern) passt, ohne sie zu \u00fcberschreiten.','Schreibe diese Zahl \u00fcber den Haken \u2014 das ist eine Ziffer deiner Antwort (des Quotienten).','Nutze den Schmierzettel unten, um die Subtraktion durchzuf\u00fchren und die n\u00e4chste Ziffer herunterzuholen, genau wie auf Papier.','Mache so weiter, bis du jede Ziffer heruntergeholt hast. Was am Ende \u00fcbrig bleibt, ist der Rest.']
    },

function opName(op){ return t(TAB_KEY[op]); }
function stepOnesLabel(n,d){ const lang=state.lang||'en'; const fn=(translations[lang]&&translations[lang].stepOnes)||translations.en.stepOnes; return fn(n,d); }
function stepPlaceLabel(n,s,d){ const lang=state.lang||'en'; const fn=(translations[lang]&&translations[lang].stepPlace)||translations.en.stepPlace; return fn(n,s,d); }

function howtoSteps(op){ const lang=state.lang||'en'; return (translations[lang]&&translations[lang].howto&&translations[lang].howto[op]) || translations.en.howto[op]; }
function t(key){
  const lang=(typeof state!=='undefined'&&state.lang) ? state.lang : 'en';
  const v=(translations[lang]&&translations[lang][key]!==undefined) ? translations[lang][key] : translations.en[key];
  return v;
}


const settings = {
  add:{digits:3, addends:2},
  sub:{topDigits:3, bottomDigits:3},
  mul:{mcDigits:2, mrDigits:1, method:'steps'},
  div:{dividendDigits:3, divisorDigits:1, exact:true, method:'whole'}
};
const settingFieldMap = {
  'add-digits':['add','digits'], 'add-addends':['add','addends'],
  'sub-top-digits':['sub','topDigits'], 'sub-bottom-digits':['sub','bottomDigits'],
  'mul-mc':['mul','mcDigits'], 'mul-mr':['mul','mrDigits'], 'mul-method':['mul','method'],
  'div-dd':['div','dividendDigits'], 'div-dr':['div','divisorDigits'], 'div-method':['div','method']
};

const state = { op:'add', mode:'practice', lang:'en', testTotal:10, testIndex:0, testScore:0, testResults:[], current:null, streak:0 };

function storageGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function storageSet(key,val){ try{ localStorage.setItem(key,val); }catch(e){} }

function readSettingsFromUI(){
  settings.add.digits=parseInt(document.getElementById('add-digits').value,10);
  settings.add.addends=parseInt(document.getElementById('add-addends').value,10);
  settings.sub.topDigits=parseInt(document.getElementById('sub-top-digits').value,10);
  settings.sub.bottomDigits=parseInt(document.getElementById('sub-bottom-digits').value,10);
  settings.mul.mcDigits=parseInt(document.getElementById('mul-mc').value,10);
  settings.mul.mrDigits=parseInt(document.getElementById('mul-mr').value,10);
  settings.mul.method=document.getElementById('mul-method').value;
  settings.div.dividendDigits=parseInt(document.getElementById('div-dd').value,10);
  settings.div.divisorDigits=parseInt(document.getElementById('div-dr').value,10);
  settings.div.exact = document.getElementById('div-exact').value==='exact';
  settings.div.method = document.getElementById('div-method').value;
  storageSet('cwp-settings', JSON.stringify(settings));
  storageSet('cwp-lastop', state.op);
}

function loadSavedSettings(){
  const raw=storageGet('cwp-settings');
  if(raw){
    try{
      const saved=JSON.parse(raw);
      Object.keys(settingFieldMap).forEach(id=>{
        const [op,key]=settingFieldMap[id];
        if(saved[op] && saved[op][key]!==undefined){
          const el=document.getElementById(id);
          const val=String(saved[op][key]);
          if(el && Array.from(el.options).some(o=>o.value===val)) el.value=val;
        }
      });
      if(saved.div && saved.div.exact!==undefined){
        document.getElementById('div-exact').value = saved.div.exact ? 'exact':'rem';
      }
    }catch(e){}
  }
}

function updateBestBadge(){
  const best=storageGet('cwp-best-'+state.op);
  const badge=document.getElementById('bestBadge');
  if(best){
    badge.textContent=translations[state.lang||'en'].bestBadgeText(opName(state.op), best);
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

function setLocked(locked){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('locked', locked));
  document.getElementById('settingsPanel').querySelectorAll('select, button').forEach(el=>{
    if(el.id!=='startTestBtn') el.disabled = locked;
  });
  document.getElementById('startTestBtn').disabled = locked;
  document.getElementById('langSelect').disabled = locked;
  document.getElementById('quitTestBtn').classList.toggle('hidden', !locked);
  document.getElementById('customSumPanel').classList.toggle('locked', locked);
  document.getElementById('customSumPanel').querySelectorAll('input, button').forEach(el=>{ el.disabled = locked; });
}

function applyLanguage(lang){
  state.lang = lang;
  document.documentElement.lang = lang;
  storageSet('cwp-lang', lang);
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    const txt = t(key);
    if(txt!==undefined) el.textContent = txt;
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    const key = el.getAttribute('data-i18n-placeholder');
    const txt = t(key);
    if(txt!==undefined) el.placeholder = txt;
  });
  const list=document.getElementById('howtoList');
  list.innerHTML='';
  howtoSteps(state.op).forEach(step=>{ const li=document.createElement('li'); li.textContent=step; list.appendChild(li); });
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
}

function switchOp(op, focus=true){
  state.op=op;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.op===op));
  document.querySelectorAll('.settings-group').forEach(g=>g.classList.toggle('active', g.dataset.op===op));
  document.querySelectorAll('.custom-sum-body').forEach(g=>g.classList.toggle('hidden', g.dataset.op!==op));
  const list=document.getElementById('howtoList');
  list.innerHTML='';
  howtoSteps(op).forEach(step=>{ const li=document.createElement('li'); li.textContent=step; list.appendChild(li); });
  updateBestBadge();
  newProblem(focus);
}

function finalizeProblem(checks, inputs, result, focus){
  state.current={checks, inputs, title:result.title, checked:false};
  document.getElementById('problemTitle').textContent=result.title;
  setupInputNav(inputs);
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
  document.getElementById('checkBtn').disabled=false;
  document.getElementById('eraseBtn').disabled=false;
  document.getElementById('tryAgainBtn').classList.add('hidden');
  document.getElementById('nextBtn').textContent = state.mode==='test' ? t('btnNextQuestion') : t('btnNewProblem');
  document.getElementById('nextBtn').disabled = state.mode==='test';
  updateProgressUI();
  if(focus){
    const firstAnswer = checks.find(c=>c.group==='answer');
    if(firstAnswer) firstAnswer.input.focus();
    else if(inputs.length) inputs[0].focus();
  }
}
function newProblem(focus=true){
  readSettingsFromUI();
  const container=document.getElementById('problemArea');
  container.innerHTML='';
  document.getElementById('scratchpad').value='';
  const checks=[]; const inputs=[];
  let result;
  if(state.op==='add') result=renderAddition(container, settings.add, checks, inputs);
  else if(state.op==='sub') result=renderSubtraction(container, settings.sub, checks, inputs);
  else if(state.op==='mul') result=renderMultiplication(container, settings.mul, checks, inputs);
  else if(state.op==='div') result=renderDivision(container, settings.div, checks, inputs);
  finalizeProblem(checks, inputs, result, focus);
}

/* ---------------- custom (user-entered) sums ---------------- */
const MAX_CUSTOM_DIGITS=8;
function validNumStr(raw){ return /^\d+$/.test(raw) && raw.length<=MAX_CUSTOM_DIGITS; }
function startCustomProblem(buildFn){
  const container=document.getElementById('problemArea');
  container.innerHTML='';
  document.getElementById('scratchpad').value='';
  const checks=[]; const inputs=[];
  const result=buildFn(container, checks, inputs);
  finalizeProblem(checks, inputs, result, true);
}
function useCustomAddition(){
  const errEl=document.getElementById('customAddError'); errEl.textContent='';
  const raws=Array.from(document.querySelectorAll('#customAddList .custom-num-input')).map(el=>el.value.trim()).filter(v=>v!=='');
  for(const raw of raws){ if(!validNumStr(raw)){ errEl.textContent=t('errInvalidNumber'); return; } }
  if(raws.length<2){ errEl.textContent=t('errNeedTwo'); return; }
  const numbers=raws.map(r=>parseInt(r,10));
  startCustomProblem((container,checks,inputs)=>{
    const r=addBlock(container, checks, inputs, numbers);
    return {title:numbers.join(' + ')+' = ?', answer:String(r.trueValue)};
  });
}
function useCustomSubtraction(){
  const errEl=document.getElementById('customSubError'); errEl.textContent='';
  const topRaw=document.getElementById('customSubTop').value.trim();
  const bottomRaw=document.getElementById('customSubBottom').value.trim();
  if(!validNumStr(topRaw) || !validNumStr(bottomRaw)){ errEl.textContent=t('errInvalidNumber'); return; }
  const top=parseInt(topRaw,10), bottom=parseInt(bottomRaw,10);
  if(top<bottom){ errEl.textContent=t('errSubOrder'); return; }
  startCustomProblem((container,checks,inputs)=>{
    const r=subBlock(container, checks, inputs, top, bottom);
    return {title:`${top} \u2212 ${bottom} = ?`, answer:String(r.trueValue)};
  });
}
function useCustomMultiplication(){
  const errEl=document.getElementById('customMulError'); errEl.textContent='';
  const aRaw=document.getElementById('customMulA').value.trim();
  const bRaw=document.getElementById('customMulB').value.trim();
  if(!validNumStr(aRaw) || !validNumStr(bRaw)){ errEl.textContent=t('errInvalidNumber'); return; }
  const a=parseInt(aRaw,10), b=parseInt(bRaw,10);
  readSettingsFromUI();
  startCustomProblem((container,checks,inputs)=>{
    const r=buildMultiplication(container, checks, inputs, a, b, settings.mul.method);
    return {title:`${a} \u00d7 ${b} = ?`, answer:String(r.finalAnswer)};
  });
}
function useCustomDivision(){
  const errEl=document.getElementById('customDivError'); errEl.textContent='';
  const aRaw=document.getElementById('customDivA').value.trim();
  const bRaw=document.getElementById('customDivB').value.trim();
  if(!validNumStr(aRaw) || !validNumStr(bRaw)){ errEl.textContent=t('errInvalidNumber'); return; }
  const dividend=parseInt(aRaw,10), divisor=parseInt(bRaw,10);
  if(divisor<1){ errEl.textContent=t('errDivisorZero'); return; }
  readSettingsFromUI();
  startCustomProblem((container,checks,inputs)=>{
    const r=buildDivision(container, checks, inputs, dividend, divisor, settings.div.method);
    return {title:`${dividend} \u00f7 ${divisor} = ?`, answer: r.remainder? `${r.quotient} ${t('labelRemainder')} ${r.remainder}` : String(r.quotient)};
  });
}
function addAnotherNumberInput(){
  const list=document.getElementById('customAddList');
  if(list.children.length>=6) return;
  const inp=document.createElement('input');
  inp.type='text'; inp.setAttribute('inputmode','numeric'); inp.className='custom-num-input';
  inp.placeholder=t('customNumPlaceholder');
  list.appendChild(inp);
}

function eraseInputs(){
  if(!state.current || state.current.checked) return;
  state.current.inputs.forEach(inp=>{ inp.value=''; inp.classList.remove('correct','incorrect'); });
  document.getElementById('scratchpad').value='';
}

function retryProblem(){
  if(!state.current || !state.current.checked) return;
  state.current.checks.forEach(c=>{
    if(!c.input.classList.contains('correct')){
      c.input.value='';
      c.input.classList.remove('correct','incorrect');
      c.input.disabled=false;
    }
  });
  state.current.checked=false;
  document.getElementById('checkBtn').disabled=false;
  document.getElementById('eraseBtn').disabled=false;
  document.getElementById('tryAgainBtn').classList.add('hidden');
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
  const firstWrong = state.current.checks.find(c=>!c.input.disabled);
  if(firstWrong) firstWrong.input.focus();
}

function updateStreakBadge(){
  const el=document.getElementById('streakBadge');
  if(state.streak>=2){
    el.textContent = `\ud83d\udd25 ${translations[state.lang||'en'].streakInARow(state.streak)}`;
    el.classList.add('show');
  } else {
    el.classList.remove('show');
  }
}

function checkAnswer(){
  if(!state.current || state.current.checked) return;
  const answerChecks = state.current.checks.filter(c=>c.group==='answer');
  const attempted = answerChecks.some(c=>c.input.value.trim()!=='');
  if(!attempted){
    const fb=document.getElementById('feedback');
    fb.textContent = t('msgFillAnswer');
    fb.className='feedback bad';
    answerChecks.forEach(c=>{
      c.input.classList.add('needs-answer');
      setTimeout(()=>c.input.classList.remove('needs-answer'), 900);
    });
    if(answerChecks.length) answerChecks[0].input.focus();
    return;
  }
  const allOk=gradeAll(state.current.checks);
  state.current.checked=true;
  document.getElementById('checkBtn').disabled=true;
  document.getElementById('eraseBtn').disabled=true;
  document.getElementById('nextBtn').disabled=false;
  document.getElementById('tryAgainBtn').classList.toggle('hidden', allOk || state.mode==='test');
  const fb=document.getElementById('feedback');
  fb.textContent = allOk ? t('msgAllCorrect') : t('msgNotQuite');
  fb.className='feedback '+(allOk?'ok':'bad');
  state.streak = allOk ? state.streak+1 : 0;
  updateStreakBadge();
  if(state.mode==='test'){
    state.testResults.push({title:state.current.title, correct:allOk});
    if(allOk) state.testScore++;
  }
  updateProgressUI();
}

function nextProblem(){
  if(state.mode==='test'){
    state.testIndex++;
    if(state.testIndex>=state.testTotal){ showSummary(); return; }
  }
  newProblem();
}

function updateProgressUI(){
  const el=document.getElementById('progressInfo');
  if(state.mode==='test'){
    el.textContent=translations[state.lang||'en'].progressText(state.testIndex+1, state.testTotal, state.testScore);
  } else {
    el.textContent='';
  }
}

function startTest(){
  state.mode='test';
  state.testTotal=parseInt(document.getElementById('testCount').value,10);
  state.testIndex=0;
  state.testScore=0;
  state.testResults=[];
  state.streak=0;
  document.getElementById('summaryPanel').classList.add('hidden');
  document.getElementById('practiceArea').classList.remove('hidden');
  setLocked(true);
  newProblem();
}

function launchConfetti(container){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors=['#C98A2B','#223046','#3C8D66','#C0453B'];
  for(let i=0;i<24;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    p.style.left=(Math.random()*100)+'%';
    p.style.background=colors[i%colors.length];
    p.style.animationDelay=(Math.random()*.4)+'s';
    p.style.transform=`rotate(${Math.random()*360}deg)`;
    container.appendChild(p);
    setTimeout(()=>p.remove(), 2200);
  }
}

function showSummary(){
  document.getElementById('practiceArea').classList.add('hidden');
  setLocked(false);
  const panel=document.getElementById('summaryPanel');
  panel.classList.remove('hidden');
  const pct=Math.round(100*state.testScore/state.testTotal);
  document.getElementById('summaryScore').textContent=translations[state.lang||'en'].summaryScoreLine(opName(state.op), state.testScore, state.testTotal, pct);
  const list=document.getElementById('summaryList'); list.innerHTML='';
  state.testResults.forEach((r,i)=>{
    const li=document.createElement('li');
    li.textContent=`${i+1}. ${r.title} \u2014 ${r.correct? t('summaryCorrect') : t('summaryIncorrect')}`;
    li.className=r.correct?'ok':'bad';
    list.appendChild(li);
  });
  const prevBest=parseInt(storageGet('cwp-best-'+state.op)||'0',10);
  if(pct>prevBest){ storageSet('cwp-best-'+state.op, String(pct)); }
  updateBestBadge();
  if(pct===100){ launchConfetti(panel); }
}

function quitTest(){
  state.mode='practice';
  setLocked(false);
  newProblem();
}

function backToPractice(){
  state.mode='practice';
  document.getElementById('summaryPanel').classList.add('hidden');
  document.getElementById('practiceArea').classList.remove('hidden');
  newProblem();
}

function printWorksheet(){
  readSettingsFromUI();
  const n=parseInt(document.getElementById('printCount').value,10);
  document.getElementById('printTitle').textContent = translations[state.lang||'en'].printWorksheetTitle(opName(state.op), n);
  const container=document.getElementById('printProblems');
  container.innerHTML='';
  const keyList=document.getElementById('printAnswerKey');
  keyList.innerHTML='';
  for(let i=0;i<n;i++){
    const wrap=document.createElement('div'); wrap.className='print-problem';
    const num=document.createElement('div'); num.style.fontWeight='700'; num.style.minWidth='2em'; num.textContent=(i+1)+'.';
    wrap.appendChild(num);
    const inner=document.createElement('div');
    const checks=[]; const inputs=[]; let result;
    if(state.op==='add') result=renderAddition(inner, settings.add, checks, inputs);
    else if(state.op==='sub') result=renderSubtraction(inner, settings.sub, checks, inputs);
    else if(state.op==='mul') result=renderMultiplication(inner, settings.mul, checks, inputs);
    else if(state.op==='div') result=renderDivision(inner, settings.div, checks, inputs);
    inputs.forEach(inp=>{ inp.value=''; inp.disabled=true; });
    wrap.appendChild(inner);
    container.appendChild(wrap);
    const keyItem=document.createElement('li');
    keyItem.textContent=`${result.title.replace(' = ?','')} = ${result.answer}`;
    keyList.appendChild(keyItem);
  }
  window.print();
}

document.getElementById('tabs').addEventListener('click', e=>{
  const btn=e.target.closest('.tab-btn');
  if(!btn || state.mode==='test') return;
  switchOp(btn.dataset.op, false);
});
document.getElementById('newBtn').addEventListener('click', ()=>{ if(state.mode==='test') return; newProblem(); });
document.getElementById('startTestBtn').addEventListener('click', startTest);
document.getElementById('eraseBtn').addEventListener('click', eraseInputs);
document.getElementById('tryAgainBtn').addEventListener('click', retryProblem);
document.getElementById('addAnotherNumBtn').addEventListener('click', addAnotherNumberInput);
document.getElementById('useCustomAddBtn').addEventListener('click', useCustomAddition);
document.getElementById('useCustomSubBtn').addEventListener('click', useCustomSubtraction);
document.getElementById('useCustomMulBtn').addEventListener('click', useCustomMultiplication);
document.getElementById('useCustomDivBtn').addEventListener('click', useCustomDivision);
document.getElementById('checkBtn').addEventListener('click', checkAnswer);
document.getElementById('nextBtn').addEventListener('click', nextProblem);
document.getElementById('quitTestBtn').addEventListener('click', quitTest);
document.getElementById('backToPracticeBtn').addEventListener('click', backToPractice);
document.getElementById('retryTestBtn').addEventListener('click', startTest);
document.getElementById('printBtn').addEventListener('click', printWorksheet);
Object.keys(settingFieldMap).forEach(id=>{
  document.getElementById(id).addEventListener('change', ()=>{ if(state.mode==='practice') newProblem(false); });
});
document.getElementById('div-exact').addEventListener('change', ()=>{ if(state.mode==='practice') newProblem(false); });
document.getElementById('langSelect').addEventListener('change', function(){
  applyLanguage(this.value);
  updateBestBadge();
  if(state.mode==='practice') newProblem(false);
});

document.addEventListener('keydown', e=>{
  if(e.target.tagName==='TEXTAREA') return;
  if(e.key==='Enter'){
    e.preventDefault();
    if(state.current && !state.current.checked) checkAnswer();
    else if(document.getElementById('nextBtn').disabled===false) nextProblem();
  } else if(e.key==='Escape'){
    eraseInputs();
  }
});

loadSavedSettings();
const supportedLangs = ['en','el','fr','de','es','it','zh','ja'];
let initialLang = storageGet('cwp-lang');
if(!initialLang){
  const browserLang = (navigator.language||'en').slice(0,2).toLowerCase();
  initialLang = supportedLangs.indexOf(browserLang)!==-1 ? browserLang : 'en';
}
document.getElementById('langSelect').value = initialLang;
applyLanguage(initialLang);
const savedOp = storageGet('cwp-lastop') || 'add';
switchOp(savedOp, false);
</script>
</body>
</html>
